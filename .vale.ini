# Vale prose linting (ADR 579 decision 1). Run it with `pnpm prose:lint <paths>`; CI does not.
# The rule set is what ADR 579's trial (2026-10-13) found worth a second look on our own docs:
# our musterd style, jdkato/a11y's structural rules, the four banned words and the lowercase
# brand name. The stock Google, Readability, ai-tells, Diátaxis and spelling rules were 84–98%
# false positives in that trial and are off. ADR 579's Consequences has the numbers.
# Packages are pinned by release URL; `vale sync` puts them in .github/styles, which git ignores
# except our own style (musterd/) and vocabulary (config/vocabularies/musterd/).
StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = musterd

Packages = https://github.com/jdkato/a11y/releases/download/v0.1.0/A11y.zip

[*.md]
BasedOnStyles = musterd

# The four banned words (reject.txt) and `musterd` in lowercase (accept.txt).
Vale.Avoid = YES
Vale.Terms = YES

# jdkato/a11y's structural rules: specific, and nearly silent on our docs (under ten alerts in
# 283,625 words), so the trial sampled none of them. HeadingLength is off: 0 of 3 sampled, since
# every hit was a wiki claim heading in the format wiki:check requires.
A11y.AltEmpty = YES
A11y.AltMissing = YES
A11y.AltRedundant = YES
A11y.AltFileName = YES
A11y.AltPlaceholder = YES
A11y.AltLength = YES
A11y.LinkGeneric = YES
A11y.LinkURL = YES
A11y.HeadingSkip = YES
A11y.HeadingMultiple = YES
A11y.TableHeader = YES
A11y.Sensory = YES
A11y.Shouting = YES
