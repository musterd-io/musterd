<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="musterd">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- isometric nameplate tile — office 2:1 projection (iso.ts KX/KY). The top face IS the mark,
       mapped square → diamond by one matrix; the front face is the slab it stands on (ADR 497, face updated by ADR 702). -->
  <g filter="url(#glow)">
    <!-- front face -->
    <path fill="#B5A06A" d="M32 38 L46.5 45.2 L32 52.4 L17.5 45.2 Z"/>
    <!-- top face: the full mark -->
    <g transform="matrix(0.01416 -0.00703 0.01416 0.00664 17.5 31.2)">
      <rect width="1024" height="1024" rx="307" fill="#EBD9A0"/><rect x="10" y="10" width="1004" height="1004" rx="302" fill="none" stroke="#785A0A" stroke-opacity=".45" stroke-width="20"/><rect x="83" y="83" width="858" height="858" rx="218" fill="none" stroke="#fff" stroke-width="48"/><path d="M295 660V416M295 416L347 364Q360 354 381 354H426Q447 354 460 364L512 416M512 416L564 364Q577 354 598 354H643Q664 354 677 364L729 416M512 660V530M729 660V530" fill="none" stroke="#1F6F6B" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/><circle cx="295" cy="660" r="46" fill="#1F6F6B"/><circle cx="512" cy="660" r="46" fill="#1F6F6B"/><circle cx="729" cy="660" r="46" fill="#1F6F6B"/><circle cx="512" cy="473" r="18" fill="#B8860B"/><circle cx="729" cy="473" r="18" fill="#B8860B"/>
    </g>
  </g>
</svg>
