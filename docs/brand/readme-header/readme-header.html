<!doctype html>
<!--
  The README header — docs/design/assets/readme-header.png (1280×320). THIS FILE IS THE SOURCE; the PNG is a
  build artifact (until 2026-10-02 it was a Figma export with no source in the repo). The lockup is the mark
  (ADR 702, ../../design/assets/chip.svg) beside the word; the tagline is brand.md §1 verbatim (ADR 563, 2026-10-12). Palette:
  brand.md §2 (zinc-900 ground, zinc-50 ink, mustard-500 accent). Self-contained: no network, no build step.
  Rebuild: see README.md here.
-->
<html lang="en">
<meta charset="utf-8" />
<title>musterd — README header</title>
<style>
  @page { size: 1280px 320px; margin: 0; }
  :root {
    --bg: #18181b; --ink: #fafafa; --muted: #a1a1aa; --accent: #e1ad01;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, 'Courier New', monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .hdr {
    width: 1280px; height: 320px; box-sizing: border-box; background: var(--bg);
    font-family: var(--mono); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  .lockup { display: flex; align-items: center; gap: 26px; }
  .lockup img { width: 92px; height: 92px; display: block; }
  .word { font-size: 84px; font-weight: 700; line-height: 1; letter-spacing: 0; }
  .word b { color: var(--accent); font-weight: 700; }
  .tag { font-size: 20px; color: var(--muted); margin: 0; }
</style>
<div class="hdr">
  <div class="lockup"><img src="../../design/assets/chip.svg" alt="" /><div class="word">muster<b>d</b></div></div>
  <p class="tag">Agents that work as a team alongside you.</p>
</div>
</html>
