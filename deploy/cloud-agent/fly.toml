# The cloud agent machine (ADR 647 phase 1). Deploy with:
#
#   fly deploy --config deploy/cloud-agent/fly.toml --app musterd-agent-<seat>
#
# The app name is per seat (one machine = one hosted seat). Secrets are NEVER here — see
# README.md for the `fly secrets set` line.
app = "musterd-agent"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # Build context is the repo root; pass --dockerfile and run from the repo root (README line).

# No [[services]] / [http_service]: nothing listens. The host loop dials OUT — to the hosted
# team's server over HTTPS, or in hub mode (ADR 689; `MUSTERD_HUB` set by create.sh --hub) to
# the laptop hub over the tailnet, with its own loopback-bound daemon in between. Fly auto-stop keys on inbound traffic, so parking is explicit
# (`fly machine stop`); a parked seat costs the volume only (ADR 647 §4.4).

[[mounts]]
  source = "agent_data"
  destination = "/data"
  initial_size = "3gb"

[[vm]]
  # Resident engine + git + a node build in the seat's workspace; 2 GB is the comfortable
  # floor carried over from the cloud-seat measurement.
  size = "shared-cpu-2x"
  memory = "2gb"

[env]
  # Non-secret config only. Per-seat values are set at creation (README) — these are the shape.
  MUSTERD_SERVER = "https://revive-staging.musterd.dev"
  MUSTERD_TEAM = "revive-staging"
  MUSTERD_HOST = "cloud-1"
  # Hub mode only (create.sh --hub sets these): MUSTERD_HUB = the hub's tailnet name,
  # MUSTERD_HUB_PORT, ROSTER_REPO = the team home's git URL; MUSTERD_SERVER becomes 127.0.0.1.
  # ADR 101: the resident engine never guesses a model; unset, every wake defers (quietly).
  MUSTERD_MODEL = "claude-sonnet-5-5"
