# musterd Cloud — the serving app (cloud increment 1D, lane 01M3Z43NHT). Stateless: any machine serves
# any team, so N ≥ 2 and rolling deploys (spec §3). Deploy only through scripts/cloud/deploy.mjs. It
# migrates before it rolls, and `fly deploy` alone never migrates.
#
# Secrets (never here): MUSTERD_DATABASE_{APP,OPERATOR}_URL and their MUSTERD_TRACE_DATABASE_* twins,
# staged by scripts/cloud/provision-neon.mjs. The owner URLs live only on the migrate app.
app = "musterd-cloud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MUSTERD_MODE = "cloud"
  MUSTERD_HOST = "0.0.0.0"
  MUSTERD_PORT = "8080"
  MUSTERD_CLOUD_HOST_SUFFIX = "musterd.dev"
  # Increment 1D's staging issuer (workers/staging-jwks). Increment 2's console replaces both lines.
  MUSTERD_CONSOLE_AUDIENCE = "https://musterd.dev"
  MUSTERD_CONSOLE_JWKS_URL = "https://musterd-staging-jwks.nick-sanders-a.workers.dev/jwks"
  MUSTERD_WEB_ROOT = "/app/packages/web/dist"

[http_service]
  internal_port = 8080
  force_https = true
  # A seat holds a WebSocket for hours. Machines never auto-stop under it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  # `/health` is 200 or a 503 with one stable sentence (spec §5.5). A machine whose database is
  # unreachable stops taking traffic until it answers 200 again.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
