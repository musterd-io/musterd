# The CooperBench run machine (lane 01M5AQE75K). Created and deployed by create.sh.
# Secrets are never here: ANTHROPIC_API_KEY is set with set-key.sh, which reads it without echo.
app = "musterd-cooperbench"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# No services: nothing listens. Runs start over `fly ssh console`, and the machine is stopped by
# hand when they finish (README), so between runs it costs the volume only.

[[mounts]]
  source = "cb_data"
  destination = "/data"
  initial_size = "50gb"

[[vm]]
  # Pilot 2 (lane 01M5FQBPHB) runs its three arms side by side, three pairs each: nine pairs, eighteen
  # agent containers, dockerd, Redis and the musterd arm's daemons. CooperBench's own core runs used
  # concurrency 3 per run. One pair at a time is comfortable on performance-2x with 8 GB; this is
  # that, scaled for nine. Stopped between runs, it costs the volume only.
  size = "performance-16x"
  memory = "32gb"
