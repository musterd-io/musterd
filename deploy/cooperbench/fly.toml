# The CooperBench run machine (lane 01M5AQE75K). Created and deployed by create.sh.
# Secrets are never here: ANTHROPIC_API_KEY is set with set-key.sh, which reads it without echo.
app = "musterd-cooperbench"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# No services: nothing listens. Runs start over `fly ssh console`, and the machine is stopped by
# hand when they finish (README), so between runs it costs the volume only.

[[mounts]]
  source = "cb_data"
  destination = "/data"
  initial_size = "50gb"

[[vm]]
  # Pilot 2 (lane 01M5FQBPHB) runs its two arms side by side, three pairs each: six pairs, twelve
  # agent containers, dockerd and the musterd arm's daemons. Pilot 1 ran three pairs at a time on
  # performance-2x with 8 GB; this is that, doubled. Stopped between runs, it costs the volume only.
  size = "performance-8x"
  memory = "16gb"
