# The phone app to TestFlight on a GitHub macOS runner (nick, 2026-10-30). EAS's free plan caps
# cloud iOS builds per month; `eas build --local` on a runner spends none of them. It still uses
# EAS for the signing credentials and the remote build number, so it needs EXPO_TOKEN. The repo is
# public, so the macOS minutes are free. Manual only: a run needs write access, and secrets never
# reach a fork's pull request. See docs/architecture/09-mobile.md "Running it on a phone".
name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (default the branch the run is started from)
        required: false
        default: ''

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check required secrets
        env:
          HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
          HAS_ASC: ${{ secrets.ASC_API_KEY_CONFIG != '' }}
        run: |
          missing=()
          [ "$HAS_EXPO" = true ] || missing+=(EXPO_TOKEN)
          [ "$HAS_ASC" = true ] || missing+=(ASC_API_KEY_CONFIG)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing secrets::Add repository secrets: ${missing[*]} (09-mobile.md)."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup
        with:
          build: 'false'

      - name: Show the toolchain
        run: xcodebuild -version && pod --version && fastlane --version | tail -1

      - name: Build the .ipa (eas build --local)
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >
          npx -y eas-cli@latest build --platform ios --profile production --local
          --non-interactive --output "$RUNNER_TEMP/musterd.ipa"

      - name: Upload to TestFlight
        working-directory: packages/mobile
        env:
          ASC_API_KEY_CONFIG: ${{ secrets.ASC_API_KEY_CONFIG }}
        run: |
          key="$RUNNER_TEMP/asc.json"
          umask 077
          printf '%s' "$ASC_API_KEY_CONFIG" > "$key"
          ASC_API_KEY_JSON="$key" scripts/upload-testflight.sh "$RUNNER_TEMP/musterd.ipa"
          rm -f "$key"
          echo "Uploaded $(git rev-parse --short HEAD) to TestFlight. Apple processes it in 10–15 minutes." >> "$GITHUB_STEP_SUMMARY"
