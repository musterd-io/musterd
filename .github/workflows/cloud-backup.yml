name: cloud-backup

on:
  schedule:
    # Nightly at 03:17 UTC (ADR 679; spec §7 + §4.8).
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: cloud-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: nightly encrypted R2 backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        id: secrets
        env:
          HAS_KEY: ${{ secrets.MUSTERD_BACKUP_KEY != '' }}
          HAS_MAIN_DB: ${{ secrets.MUSTERD_DATABASE_OWNER_URL != '' }}
          HAS_R2_ACCOUNT: ${{ secrets.MUSTERD_BACKUP_R2_ACCOUNT_ID != '' }}
          HAS_R2_AK: ${{ secrets.MUSTERD_BACKUP_R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SK: ${{ secrets.MUSTERD_BACKUP_R2_SECRET_ACCESS_KEY != '' }}
        run: |
          missing=()
          [ "$HAS_KEY" = true ] || missing+=(MUSTERD_BACKUP_KEY)
          [ "$HAS_MAIN_DB" = true ] || missing+=(MUSTERD_DATABASE_OWNER_URL)
          [ "$HAS_R2_ACCOUNT" = true ] || missing+=(MUSTERD_BACKUP_R2_ACCOUNT_ID)
          [ "$HAS_R2_AK" = true ] || missing+=(MUSTERD_BACKUP_R2_ACCESS_KEY_ID)
          [ "$HAS_R2_SK" = true ] || missing+=(MUSTERD_BACKUP_R2_SECRET_ACCESS_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloud backup skipped::Missing required repository secrets (${missing[*]}). Operator LaunchAgent studio.sandrise.musterd-cloud-backup on mac.lan is the active nightly runner until repository secrets are configured."
            echo "Cloud backup skipped on GitHub Actions (operator LaunchAgent studio.sandrise.musterd-cloud-backup on mac.lan runs nightly until repo secrets are set: ${missing[*]})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 10.6.5

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run nightly encrypted R2 backup and retention prune
        if: steps.secrets.outputs.ready == 'true'
        env:
          MUSTERD_BACKUP_KEY: ${{ secrets.MUSTERD_BACKUP_KEY }}
          MUSTERD_DATABASE_OWNER_URL: ${{ secrets.MUSTERD_DATABASE_OWNER_URL }}
          MUSTERD_TRACE_DATABASE_OWNER_URL: ${{ secrets.MUSTERD_TRACE_DATABASE_OWNER_URL }}
          MUSTERD_CONSOLE_DATABASE_OWNER_URL: ${{ secrets.MUSTERD_CONSOLE_DATABASE_OWNER_URL }}
          MUSTERD_BACKUP_R2_ACCOUNT_ID: ${{ secrets.MUSTERD_BACKUP_R2_ACCOUNT_ID }}
          MUSTERD_BACKUP_R2_BUCKET: ${{ secrets.MUSTERD_BACKUP_R2_BUCKET }}
          MUSTERD_BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.MUSTERD_BACKUP_R2_ACCESS_KEY_ID }}
          MUSTERD_BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.MUSTERD_BACKUP_R2_SECRET_ACCESS_KEY }}
        run: node scripts/cloud/backup.mjs
