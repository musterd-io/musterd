# npm release of @musterd/* (ADR 782). Pushing a tag vX.Y.Z on the merge commit of a
# `pnpm release --version X.Y.Z` bump PR starts it. Two jobs, split on purpose:
#
#   pack     no OIDC token. Builds, runs the consumer smoke (scripts/release/smoke.ts) — which
#            installs third-party deps from the registry and runs their install scripts — and
#            uploads the smoked tarballs with their SHA256SUMS.
#   publish  the only job that can mint a publish credential. Held by the `npm-release`
#            environment for nick's approval, so a tag alone publishes nothing. Installs nothing,
#            builds nothing: checks the sums and runs `npm publish --provenance` on those files.
#
# No npm token: npm trusted publishing exchanges the publish job's OIDC token (id-token: write) for a
# one-time credential, and npm signs a provenance statement tying each tarball to this workflow,
# this repo and the tagged commit. Each @musterd/* package on npmjs.com names this file and the
# `npm-release` environment as its trusted publisher; a run from any other workflow, fork or
# environment is refused by the registry, not by us.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: build, smoke, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Only code that landed through gates ships: a tag on a commit that never merged is refused
      # before it can ask for an approval.
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error title=Not on main::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          }

      - uses: ./.github/actions/setup
        with:
          build: 'false'

      - name: Build, smoke and pack
        run: pnpm release --pack --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish @musterd/* with provenance
    needs: pack
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Node only — no pnpm, no install: scripts/release.ts imports nothing but node builtins.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10. Pinned, because this is the
      # binary that holds the publish credential.
      - name: Install npm 11
        run: npm install -g npm@11.21.1 && npm --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs

      - name: Publish the smoked tarballs
        run: >-
          node --disable-warning=ExperimentalWarning scripts/release.ts
          --publish --tag "$GITHUB_REF_NAME" --tarballs "$RUNNER_TEMP/tarballs"

      # The lane's done-condition, checked where it can fail the run: every package at this version
      # carries a provenance attestation on the registry.
      - name: Verify provenance on the registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          missing=()
          for name in @musterd/protocol @musterd/telemetry @musterd/server @musterd/mcp @musterd/cli; do
            att="$(npm view "$name@$version" dist.attestations.provenance.predicateType 2>/dev/null || true)"
            if [ -n "$att" ]; then echo "✓ $name@$version — $att"; else missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=No provenance::published without a provenance attestation: ${missing[*]}"
            exit 1
          fi
