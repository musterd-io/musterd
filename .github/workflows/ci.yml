# CI — the authoritative merge gate (ADR 106). Runs the same gates agents run locally, on every PR
# — each gate where its inputs changed (ADR 499): a docs-only change runs the docs gates alone, and
# the Chrome a11y gates run when packages/web (or what renders it) changed. Since ADR 570 the gates
# run as parallel jobs that `plan` picks from the diff, and `gates` is their fan-in. Local runs are
# an optional fast smoke-test; THIS is the source of truth that branch protection requires green
# before a squash-merge. Keep the job name `gates` stable — it's the required check.
#
# Shape (ADR 106 amendment 2026-09-03): the gates run as PARALLEL leaves and `gates` is the fan-in.
# Measured before the change, one serial job took 8m10s per PR, and 78% of it was two steps that do
# not depend on each other — the Chrome contrast sweep (227s) and tests+coverage (157s). Every
# gate still ran on every PR then; only the wall clock changed. Each leaf does its own checkout+build
# (.github/actions/setup) so nothing is shared through an artifact.
#
# Every leaf checks out FULL history (fetch-depth: 0, ~3s). The serial job had it for
# roadmap-truth:check and change-adr:check, and the first fanned-out run showed a third reader:
# scripts/wiki-probe.test.ts walks `git ls-tree` / `rev-list` against old SHAs and failed on the
# depth-1 default in the coverage leaf. History is cheap; discovering the next reader is not.
#
# Shape (ADR 498, 2026-10-03): a `plan` job picks the test drivers (ADR 492) AND the shard count;
# the coverage leaf then runs as FOUR SHARDS plus a merge when both drivers run (three until the
# integration suite was split into eight files, lane 01M3ZRPWDB), and as the one job
# it always was when SQLite alone does. The repo went private on 2026-10-02 and ubuntu-latest became
# 2 vCPU per job; the suite is CPU-bound there, so the both-driver leaf took 25–27 min on every push
# to main (18–23 min after #1985's two workers) while every other leaf finished in under 4. Each
# shard runs a quarter of the files with `--reporter=blob`; the merge job folds the blobs and is the
# ONLY place the coverage floors are checked on a sharded run (a shard's map is partial by
# construction). ADR 492 rejected sharding for the compute it adds per run — about two setups and a
# merge, ~6.5 runner-minutes — which is why the SQLite-only runs (most PRs) do not shard; its driver
# scoping stays as the compute lever, this is the wall-clock one. Minutes are billed on a private
# repo: on 2026-10-03 GitHub refused to start jobs over the org's spending limit.
#
# Cost shape (ADR 508, 2026-10-04): a push to main runs static + docs only. The PR that produced
# the squash commit already ran coverage and the a11y leaves on the same change, and the main run
# was 44% of billed minutes for a second verdict on it. Full coverage and both a11y leaves run on
# main every 4 hours instead (`schedule`), and only when main moved since the last scheduled run.
# A red scheduled run opens or updates one `ci: main is red` issue, because nobody would see it
# otherwise. Main runs no longer cancel each other: a cancelled main run bills the minutes it used
# and leaves its commit with no verdict.
#
# Shape (ADR 515, 2026-10-05): ONE job. The fan-out above was right for wall time and wrong for a
# billed repo: every job pays its own checkout + install + build (~1.2 min) and GitHub rounds each
# job up to a whole minute, so the 6-second `plan` and `gates` jobs billed a minute apiece. Measured
# in the 2.5h after ADR 510/512: plan + gates + static + docs were 55% of billed minutes, the tests
# 34%. `gates` now decides, sets up once, and runs every gate as a step — skipping steps exactly
# where the old leaves were skipped. Coverage is no longer sharded: the both-driver suite runs
# only on main's 4-hourly check and on `pglite`-labelled PRs, where wall time matters least. Draft
# PRs run CI like any other PR (ADR 523): skipping them let a draft→ready→auto-merge land unchecked.
#
# Shape (ADR 570, 2026-10-12): parallel jobs again. The repo is public (ADR 565), so minutes are free
# and the 4-CPU runner is too (ADR 569); ADR 515's reason for one job — billed setup per job — is
# gone. One serial job took 605s on 2026-10-12 (tests 221s, a11y ~270s, static + docs ~82s, setup
# 32s); in parallel the longest job sets the wall time. The both-driver suite shards four ways again,
# with `coverage-merge` checking the floors, as in ADR 498. Ubicloud remains the outage fallback
# (ADR 569): every `runs-on` moves together, and shards and workers go back to 2-CPU settings.
name: CI

on:
  pull_request:
    # `labeled`/`unlabeled` so adding the `pglite` label re-runs CI with both drivers (ADR 510). No
    # `ready_for_review`: drafts already run CI (ADR 523), so marking one ready would re-test the
    # same commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # ADR 508: full coverage + a11y on main every 4 hours. ADR 512: a push to main runs the full check
  # when the last one is over 4 hours old. ADR 535: the cron probes HOURLY, because GitHub drops
  # scheduled runs (3 of 6 never started on 2026-10-05/06); a probe runs the full check only when
  # the last one is over 4 hours old and code moved since, so a dropped run costs an hour, not four.
  # ADR 542: GitHub then fired 3 of 22 hourly slots, so the daemon host also dispatches the same
  # probe hourly (`probe: true`). A dispatch without `probe` still forces the full check.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Run as the hourly probe (ADR 542): full check only if due, else skip'
        type: boolean
        default: false

# A PR keeps one in-flight run per ref, so a new push cancels the stale one. Main does not cancel
# (ADR 508): each push and each scheduled run gets its own group, keyed by event and SHA. A
# cancelled main run still bills the minutes it used (148 billed minutes on 2026-10-04) and leaves
# its commit unverified.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ADR 570: the gates run as PARALLEL jobs again, now the repo is public and minutes are free (ADR
  # 515 had folded them into one job only because each job's setup was billed). `plan` decides; each
  # job below does its own checkout + setup; `gates` is the fan-in and the one required check.
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      kinds: ${{ steps.pick.outputs.kinds }}
      suite: ${{ steps.pick.outputs.suite }}
      coverage: ${{ steps.pick.outputs.coverage }}
      a11y: ${{ steps.pick.outputs.a11y }}
      docs: ${{ steps.pick.outputs.docs }}
      fullcheck: ${{ steps.pick.outputs.fullcheck }}
      shard_count: ${{ steps.pick.outputs.count }}
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: roadmap-truth:check, change-adr:check and wiki-probe read old SHAs.
          fetch-depth: 0

      - name: Pick the jobs, the test drivers and the shard count
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PROBE: ${{ github.event_name == 'schedule' || inputs.probe == true }}
          PGLITE_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pglite') }}
        run: |
          suite=true; a11y=true; kinds=both; docs=true; why="no parent to diff — everything runs"
          # ADR 512/515: the last FULL main check is the newest `full-main-check` artifact from a main
          # run; only the full check uploads it (below).
          full=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=full-main-check&per_page=50" \
            -q '[.artifacts[] | select(.workflow_run.head_branch == "main")][0] | "\(.created_at) \(.workflow_run.head_sha)"' 2>/dev/null || true)
          full_at=${full%% *}; full_sha=${full##* }
          full_age=999999
          if [ -n "$full_at" ] && [ "$full_at" != null ]; then full_age=$(( $(date -u +%s) - $(date -u -d "$full_at" +%s) )); fi
          echo "last full main check: ${full_at:-none} (${full_sha:-—}), ${full_age}s ago"
          # A full check marks itself in flight when it STARTS (`full-main-check-started`, below). The
          # finish marker alone let every push during a running 21-minute full check start its own:
          # five full runs in twenty minutes on 2026-10-05. In flight = a start marker newer than the
          # last finish marker and under 45 minutes old (a full check takes ~21; one that died
          # without finishing stops blocking after that, and the next push retries it).
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=full-main-check-started&per_page=50" \
            -q '[.artifacts[] | select(.workflow_run.head_branch == "main")][0] | .created_at' 2>/dev/null || true)
          inflight=false
          if [ -n "$started" ] && [ "$started" != null ] && [[ "$started" > "${full_at:-0}" ]] \
            && [ $(( $(date -u +%s) - $(date -u -d "$started" +%s) )) -lt 2700 ]; then inflight=true; fi
          echo "full main check in flight: $inflight (started ${started:-never})"
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            # ADR 535: an hourly probe. "Code moved" = any path outside docs/ and root *.md changed
            # since the last full check's SHA; an unknown or unreachable SHA counts as moved.
            moved=true
            if [ -n "$full_sha" ] && [ "$full_sha" != null ] && changed=$(git diff --name-only "$full_sha" HEAD 2>/dev/null) \
              && { [ -z "$changed" ] || ! echo "$changed" | grep -q -v -E '^(docs/|[^/]+\.md$)'; }; then moved=false; fi
            if [ "$PROBE" = true ] && { [ "$moved" = false ] || [ "$full_age" -lt 14400 ] || [ "$inflight" = true ]; }; then
              suite=false; a11y=false; docs=false; kinds=sqlite
              why="probe: no code moved since the last full check ($full_sha), it is under 4h old (${full_age}s), or one is in flight (ADR 535)"
            else
              why="$EVENT on ${GITHUB_REF_NAME} — the full main check (ADR 508)"
            fi
          elif git rev-parse -q --verify HEAD^1 >/dev/null; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -q -v -E '^(docs/|[^/]+\.md$)'; then
              suite=false; a11y=false; kinds=sqlite; why="every changed path is docs/ or a root *.md — the docs gates run alone"
            else
              if echo "$changed" | grep -q -E '^(packages/web/|scripts/a11y/|\.github/|package\.json$|pnpm-lock\.yaml$)'; then a11y=true; else a11y=false; fi
              if [ "$EVENT" = pull_request ]; then
                if [ "$PGLITE_LABEL" = true ]; then why="the PR carries the pglite label (ADR 510)"
                else kinds=sqlite; why="a PR runs SQLite only; PGlite runs on the 4-hourly main check (ADR 510)"; fi
              else
                why="push to ${GITHUB_REF_NAME}"
              fi
            fi
          fi
          coverage=$suite
          if [ "$EVENT" = push ]; then
            if [ "$suite" = true ] && [ "$full_age" -ge 14400 ] && [ "$inflight" = false ]; then
              kinds=both; a11y=true; why="$why — last full main check ${full_age}s ago (>4h), so this push runs it (ADR 512)"
            else
              coverage=false; a11y=false; why="$why — coverage + a11y run on the next full main check (ADR 508, ADR 512)"
            fi
          fi
          # ADR 570 (ADR 498's shape): both drivers run as four shards plus a merge. ADR 572: SQLite
          # alone (most PRs) runs as two, so the coverage job stops setting a PR's wall time.
          if [ "$kinds" = both ]; then count=4; shards='[1, 2, 3, 4]'; else count=2; shards='[1, 2]'; fi
          # The full main check: both drivers, on main. It leaves the marker the next push reads.
          fullcheck=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$coverage" = true ] && [ "$kinds" = both ]; then fullcheck=true; fi
          {
            echo "kinds=$kinds"; echo "suite=$suite"; echo "coverage=$coverage"
            echo "a11y=$a11y"; echo "docs=$docs"; echo "fullcheck=$fullcheck"
            echo "count=$count"; echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"
          {
            echo "plan: suite=$suite coverage=$coverage a11y=$a11y docs=$docs full=$fullcheck — $why"
            echo "MUSTERD_TEST_DRIVER=$kinds (ADR 492, ADR 510); coverage in $count shard(s) (ADR 570)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Claim the full check BEFORE its jobs start, so a push landing meanwhile sees it in flight and
      # runs static + docs only (see the pick step).
      - name: Mark the full main check in flight
        if: steps.pick.outputs.fullcheck == 'true'
        run: |
          mkdir -p full-main-check-started
          echo "${GITHUB_SHA} $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${GITHUB_RUN_ID}" > full-main-check-started/marker.txt
      - name: Upload the in-flight marker
        if: steps.pick.outputs.fullcheck == 'true'
        # Pinned by commit (not by tag). v7.0.1.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-main-check-started
          path: full-main-check-started/
          retention-days: 2

  static:
    name: static
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.suite == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: roadmap-truth:check, change-adr:check and wiki-probe read old SHAs.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck
      # Byte budgets for the built web client (ADR 151).
      - name: Perf budgets
        run: pnpm perf:check
      # Standing-context byte budgets (spec 2026-08-03).
      - name: Context budgets
        run: pnpm context:check
      # Runs after Build: the import resolver follows workspace packages to their ./dist.
      - name: Lint
        run: pnpm lint

  # prettier + roadmap / arch-trees / obs-evals / adr-numbers / guidance / vocab / tokens /
  # migrations / source-nul / build-context / wiki / intents / controls / watch checks.
  docs:
    name: docs
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: roadmap-truth:check, change-adr:check and wiki-probe read old SHAs.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Gates (format + docs)
        run: pnpm format:check
      # A protocol schema change or a new runtime dep must carry an ADR; an accepted ADR's Decision
      # is immutable (ADR 180). Diff-based, so PRs only.
      - name: ADR-gated changes
        if: github.event_name == 'pull_request'
        env:
          CHANGE_ADR_BASE: origin/${{ github.base_ref }}
        run: pnpm change-adr:check

  # Two shards when SQLite alone runs (most PRs, ADR 572), four when both drivers run (ADR 498's
  # shape, back under ADR 570), each followed by `coverage-merge`: a shard's coverage map is
  # partial, so only the merge checks the floors. A one-shard run (shard_count 1) still enforces
  # them itself. Four workers per shard on the
  # 4-CPU public-repo runner (ADR 569); two on a 2-CPU one (#1985). The blob goes to
  # coverage-blobs/, not .vitest-reports/: upload-artifact skips hidden paths by default.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.coverage == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: roadmap-truth:check, change-adr:check and wiki-probe read old SHAs.
          fetch-depth: 0

      # ADR 569's eval reads this: the runner's size, so a timing change can be put down to it.
      - name: Runner
        run: echo "cpus=$(nproc) mem_gb=$(free -g | awk '/^Mem:/{print $2}')"
      - uses: ./.github/actions/setup
      - name: Tests + coverage (shard ${{ matrix.shard }} of ${{ needs.plan.outputs.shard_count }})
        run: pnpm coverage --maxWorkers=4 --shard=${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }} --reporter=default --reporter=github-actions --reporter=blob --outputFile.blob=coverage-blobs/blob-${{ matrix.shard }}-${{ needs.plan.outputs.shard_count }}.json
        env:
          MUSTERD_TEST_DRIVER: ${{ needs.plan.outputs.kinds }}
          MUSTERD_COVERAGE_SHARD: ${{ needs.plan.outputs.shard_count != '1' && matrix.shard || '' }}
      - name: Upload this shard's report blob
        if: needs.plan.outputs.shard_count != '1'
        # Pinned by commit (not by tag). v7.0.1.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: coverage-blobs/
          if-no-files-found: error
          retention-days: 1

  # The fold, on sharded runs only: replays the shard results, merges the coverage maps and checks
  # the floors on the MERGED map. The blobs hold source-mapped coverage, so it installs but does not
  # build, and it runs from the same checkout path as the shards (the floors are path globs). It
  # refuses unless every shard's blob is present — a missing one would pass the floors vacuously.
  coverage-merge:
    name: coverage-merge
    runs-on: ubuntu-latest
    needs: [plan, coverage]
    if: needs.plan.outputs.coverage == 'true' && needs.plan.outputs.shard_count != '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - name: Download the shard blobs
        # Pinned by commit (not by tag). v8.0.1.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-blob-*
          merge-multiple: true
          path: coverage-blobs
      - name: Merge reports + enforce the coverage floors
        env:
          EXPECTED: ${{ needs.plan.outputs.shard_count }}
        run: |
          ls -la coverage-blobs
          have="$(find coverage-blobs -name 'blob-*.json' | wc -l | tr -d ' ')"
          test "$have" -eq "$EXPECTED" || { echo "::error::expected $EXPECTED blobs, found $have"; exit 1; }
          pnpm coverage:merge

  # Contrast cannot be computed from hex (alpha tints, color-mix()), so it sweeps the built client
  # in real Chrome; target size (WCAG 2.2 AA 2.5.8) is measured at phone width. Two jobs, because
  # the phases share nothing but the dist: the prerendered routes, and the connected phase, which
  # stands up a throwaway daemon over a synthetic team so /board and /live are measured past their
  # sign-in screen. CHROME_BIN is named so a runner-image change fails loudly.
  a11y-prerender:
    name: a11y-prerender
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.a11y == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: roadmap-truth:check, change-adr:check and wiki-probe read old SHAs.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: A11y contrast (prerendered routes)
        run: pnpm a11y:check --static-only
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: A11y tap targets (390x844, prerendered)
        run: pnpm a11y:targets:check --static-only
        env:
          CHROME_BIN: /usr/bin/google-chrome
      # The gate about the gate: five fixtures with known verdicts, three of which MUST fail.
      - name: A11y tap-target falsifier (controls)
        run: node scripts/a11y/target-size-falsifier.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome

  a11y-connected:
    name: a11y-connected
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.a11y == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: roadmap-truth:check, change-adr:check and wiki-probe read old SHAs.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: A11y contrast (connected board + live)
        run: pnpm a11y:check --connected-only
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: A11y tap targets (390x844, connected board + live)
        run: pnpm a11y:targets:check --connected-only
        env:
          CHROME_BIN: /usr/bin/google-chrome

  # The fan-in, and the ONLY required check (ADR 106 §2). NEVER give it an `if:` that can skip it:
  # branch protection counts a SKIPPED required check as passing (#2104, ADR 523). `always()` so it
  # runs when a job fails, and then it asserts every job SUCCEEDED by name — a bare `always()` with
  # no result check is the classic mistake that turns a red job into a green gate. The sanctioned
  # skips, and only these: `coverage-merge` on a one-shard run; `static`, `coverage` and
  # `coverage-merge` when the diff is docs-only; `coverage` and `coverage-merge` when plan skipped
  # coverage (a push to main between full checks); the a11y jobs when plan said the web did not
  # change; `docs` when plan skipped it (a probe that found nothing due). Anything else — a skip for
  # another reason, a cancel, a failed `plan` — is red.
  gates:
    name: gates
    runs-on: ubuntu-latest
    needs: [plan, static, docs, coverage, coverage-merge, a11y-prerender, a11y-connected]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Every job must have succeeded, or been skipped by plan
        env:
          RESULTS: ${{ toJSON(needs) }}
          SHARDS: ${{ needs.plan.outputs.shard_count }}
          SUITE: ${{ needs.plan.outputs.suite }}
          COVERAGE: ${{ needs.plan.outputs.coverage }}
          A11Y: ${{ needs.plan.outputs.a11y }}
          DOCS: ${{ needs.plan.outputs.docs }}
        run: |
          echo "$RESULTS" | jq .
          echo "plan: suite=$SUITE coverage=$COVERAGE a11y=$A11Y docs=$DOCS shards=$SHARDS"
          failed="$(echo "$RESULTS" | jq -r --arg shards "$SHARDS" --arg suite "$SUITE" --arg coverage "$COVERAGE" --arg a11y "$A11Y" --arg docs "$DOCS" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  (.key == "coverage-merge" and .value.result == "skipped" and $shards == "1")
                  or ((.key == "static" or .key == "coverage" or .key == "coverage-merge") and .value.result == "skipped" and $suite == "false")
                  or ((.key == "coverage" or .key == "coverage-merge") and .value.result == "skipped" and $coverage == "false")
                  or (.key == "docs" and .value.result == "skipped" and $docs == "false")
                  or ((.key == "a11y-prerender" or .key == "a11y-connected") and .value.result == "skipped" and $a11y == "false")
                ) | not)
            | .key')"
          if [ -n "$failed" ]; then
            echo "::error::gates — job(s) did not succeed: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "gates — all $(echo "$RESULTS" | jq 'length') jobs succeeded or were skipped by plan"

      # ADR 512/515: the marker the next push to main reads to decide whether it must run the full
      # check. Written only when every job of the full check passed — a red one is retried by the
      # next push.
      - name: Mark the full main check
        if: success() && needs.plan.outputs.fullcheck == 'true'
        run: |
          mkdir -p full-main-check
          echo "${GITHUB_SHA} $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${GITHUB_RUN_ID}" > full-main-check/marker.txt
      - name: Upload the full-main-check marker
        if: success() && needs.plan.outputs.fullcheck == 'true'
        # Pinned by commit (not by tag). v7.0.1.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-main-check
          path: full-main-check/
          retention-days: 2

  # ADR 508: a scheduled run is main's only full check that no PR waits on, so a red one would go
  # unseen. Open one `ci: main is red` issue, or comment on the open one, naming the run. ADR 542:
  # a dispatched probe is the same check, so it reports the same way.
  main-red:
    name: main-red
    runs-on: ubuntu-latest
    needs: [gates]
    if: always() && needs.gates.result == 'failure' && (github.event_name == 'schedule' || inputs.probe == true)
    permissions:
      issues: write
    steps:
      - name: Open or update the main-is-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Scheduled CI on main failed at ${GITHUB_SHA} — ${RUN_URL}. The 4-hourly run is main's only full coverage + a11y check (ADR 508); fix forward, then close this issue."
          n=$(gh issue list --state open --search 'in:title "ci: main is red"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title 'ci: main is red' --body "$body"; fi
