# CI — the authoritative merge gate (ADR 106). Runs the same gates agents run locally, on every PR
# — each gate where its inputs changed (ADR 499): a docs-only change runs the docs gates alone, and
# the Chrome a11y gates run when packages/web (or what renders it) changed. Since ADR 515 every gate
# is a step of the one `gates` job, which decides from the diff which steps run. Local runs are an
# optional fast smoke-test; THIS is the source of truth that branch protection requires green before
# a squash-merge. Keep the job name `gates` stable — it's the required check.
#
# Shape (ADR 106 amendment 2026-09-03): the gates run as PARALLEL leaves and `gates` is the fan-in.
# Measured before the change, one serial job took 8m10s per PR, and 78% of it was two steps that do
# not depend on each other — the Chrome contrast sweep (227s) and tests+coverage (157s). Every
# gate still ran on every PR then; only the wall clock changed. Each leaf does its own checkout+build
# (.github/actions/setup) so nothing is shared through an artifact.
#
# Every leaf checks out FULL history (fetch-depth: 0, ~3s). The serial job had it for
# roadmap-truth:check and change-adr:check, and the first fanned-out run showed a third reader:
# scripts/wiki-probe.test.ts walks `git ls-tree` / `rev-list` against old SHAs and failed on the
# depth-1 default in the coverage leaf. History is cheap; discovering the next reader is not.
#
# Shape (ADR 498, 2026-10-03): a `plan` job picks the test drivers (ADR 492) AND the shard count;
# the coverage leaf then runs as FOUR SHARDS plus a merge when both drivers run (three until the
# integration suite was split into eight files, lane 01M3ZRPWDB), and as the one job
# it always was when SQLite alone does. The repo went private on 2026-10-02 and ubuntu-latest became
# 2 vCPU per job; the suite is CPU-bound there, so the both-driver leaf took 25–27 min on every push
# to main (18–23 min after #1985's two workers) while every other leaf finished in under 4. Each
# shard runs a quarter of the files with `--reporter=blob`; the merge job folds the blobs and is the
# ONLY place the coverage floors are checked on a sharded run (a shard's map is partial by
# construction). ADR 492 rejected sharding for the compute it adds per run — about two setups and a
# merge, ~6.5 runner-minutes — which is why the SQLite-only runs (most PRs) do not shard; its driver
# scoping stays as the compute lever, this is the wall-clock one. Minutes are billed on a private
# repo: on 2026-10-03 GitHub refused to start jobs over the org's spending limit.
#
# Cost shape (ADR 508, 2026-10-04): a push to main runs static + docs only. The PR that produced
# the squash commit already ran coverage and the a11y leaves on the same change, and the main run
# was 44% of billed minutes for a second verdict on it. Full coverage and both a11y leaves run on
# main every 4 hours instead (`schedule`), and only when main moved since the last scheduled run.
# A red scheduled run opens or updates one `ci: main is red` issue, because nobody would see it
# otherwise. Main runs no longer cancel each other: a cancelled main run bills the minutes it used
# and leaves its commit with no verdict.
#
# Shape (ADR 515, 2026-10-05): ONE job. The fan-out above was right for wall time and wrong for a
# billed repo: every job pays its own checkout + install + build (~1.2 min) and GitHub rounds each
# job up to a whole minute, so the 6-second `plan` and `gates` jobs billed a minute apiece. Measured
# in the 2.5h after ADR 510/512: plan + gates + static + docs were 55% of billed minutes, the tests
# 34%. `gates` now decides, sets up once, and runs every gate as a step — skipping steps exactly
# where the old leaves were skipped. Coverage is no longer sharded: the both-driver suite runs
# only on main's 4-hourly check and on `pglite`-labelled PRs, where wall time matters least. A draft
# PR runs nothing until it is marked ready.
name: CI

on:
  pull_request:
    # `labeled`/`unlabeled` so adding the `pglite` label re-runs CI with both drivers (ADR 510).
    # `ready_for_review` because a draft PR does not run CI (ADR 515); `labeled`/`unlabeled` so the
    # `pglite` label re-runs with both drivers (ADR 510).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  # ADR 508: full coverage + a11y on main, every 4 hours at :17, skipped when main has not moved.
  # ADR 512: a backstop only — GitHub has not fired it since the repo went private; a push to main
  # runs the full check when the last one is over 4 hours old.
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

# A PR keeps one in-flight run per ref, so a new push cancels the stale one. Main does not cancel
# (ADR 508): each push and each scheduled run gets its own group, keyed by event and SHA. A
# cancelled main run still bills the minutes it used (148 billed minutes on 2026-10-04) and leaves
# its commit unverified.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The ONLY required check (ADR 106 §2) and, since ADR 515, the only job that runs the gates. Each
  # former leaf is a step group below, gated on the same `pick` decision the old `plan` job made.
  # A draft PR skips the job; a skipped required check would read as passing, which is safe only
  # because GitHub will not merge a draft, and `ready_for_review` re-runs it before anyone can.
  gates:
    name: gates
    # ADR 517: Ubicloud's 2 vCPU runner — same size as ubuntu-latest, about a fifth of the per-minute
    # price, a fresh VM per job, and not subject to GitHub's hosted-runner queue. To go back, set
    # this to `ubuntu-latest`; nothing else in the job depends on where it runs.
    runs-on: ubicloud-standard-2
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: roadmap-truth:check, change-adr:check and wiki-probe read old SHAs.
          fetch-depth: 0

      # ADR 499 / 492 / 498 / 508 / 510 / 512 — which gates run, on which drivers. Same rules as the
      # old `plan` job, now a step: docs-only diffs run the docs gates alone; a11y runs when
      # packages/web, the sweep scripts, the workflow or deps changed; a PR runs SQLite unless
      # labelled `pglite`; a push to main runs static + docs unless the last full main check is over
      # 4 hours old; a scheduled run skips everything when the last full check already tested HEAD.
      - name: Pick the gates and the test drivers
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PGLITE_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pglite') }}
        run: |
          suite=true; a11y=true; kinds=both; docs=true; why="no parent to diff — everything runs"
          # ADR 512/515: the last FULL main check is the newest `full-main-check` artifact from a main
          # run; only the full check uploads it (below).
          full=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=full-main-check&per_page=50" \
            -q '[.artifacts[] | select(.workflow_run.head_branch == "main")][0] | "\(.created_at) \(.workflow_run.head_sha)"' 2>/dev/null || true)
          full_at=${full%% *}; full_sha=${full##* }
          full_age=999999
          if [ -n "$full_at" ] && [ "$full_at" != null ]; then full_age=$(( $(date -u +%s) - $(date -u -d "$full_at" +%s) )); fi
          echo "last full main check: ${full_at:-none} (${full_sha:-—}), ${full_age}s ago"
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            if [ "$EVENT" = schedule ] && [ "$full_sha" = "$GITHUB_SHA" ]; then
              suite=false; a11y=false; docs=false; kinds=sqlite; why="main has not moved since the last full check ($full_sha)"
            else
              why="$EVENT on ${GITHUB_REF_NAME} — the full main check (ADR 508)"
            fi
          elif git rev-parse -q --verify HEAD^1 >/dev/null; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -q -v -E '^(docs/|[^/]+\.md$)'; then
              suite=false; a11y=false; kinds=sqlite; why="every changed path is docs/ or a root *.md — the docs gates run alone"
            else
              if echo "$changed" | grep -q -E '^(packages/web/|scripts/a11y/|\.github/|package\.json$|pnpm-lock\.yaml$)'; then a11y=true; else a11y=false; fi
              if [ "$EVENT" = pull_request ]; then
                if [ "$PGLITE_LABEL" = true ]; then why="the PR carries the pglite label (ADR 510)"
                else kinds=sqlite; why="a PR runs SQLite only; PGlite runs on the 4-hourly main check (ADR 510)"; fi
              else
                why="push to ${GITHUB_REF_NAME}"
              fi
            fi
          fi
          coverage=$suite
          if [ "$EVENT" = push ]; then
            if [ "$suite" = true ] && [ "$full_age" -ge 14400 ]; then
              kinds=both; a11y=true; why="$why — last full main check ${full_age}s ago (>4h), so this push runs it (ADR 512)"
            else
              coverage=false; a11y=false; why="$why — coverage + a11y run on the next full main check (ADR 508, ADR 512)"
            fi
          fi
          # The full main check: both drivers, on main. It leaves the marker the next push reads.
          fullcheck=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$coverage" = true ] && [ "$kinds" = both ]; then fullcheck=true; fi
          {
            echo "kinds=$kinds"; echo "suite=$suite"; echo "coverage=$coverage"
            echo "a11y=$a11y"; echo "docs=$docs"; echo "fullcheck=$fullcheck"
          } >> "$GITHUB_OUTPUT"
          {
            echo "plan: suite=$suite coverage=$coverage a11y=$a11y docs=$docs full=$fullcheck — $why"
            echo "MUSTERD_TEST_DRIVER=$kinds (ADR 492, ADR 510); one job (ADR 515)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup
        if: steps.pick.outputs.suite == 'true' || steps.pick.outputs.docs == 'true'

      # --- static (was the `static` leaf) ---------------------------------------------------------
      - name: Typecheck
        if: steps.pick.outputs.suite == 'true'
        run: pnpm typecheck
      # Byte budgets for the built web client (ADR 151).
      - name: Perf budgets
        if: steps.pick.outputs.suite == 'true'
        run: pnpm perf:check
      # Standing-context byte budgets (spec 2026-08-03).
      - name: Context budgets
        if: steps.pick.outputs.suite == 'true'
        run: pnpm context:check
      # Runs after Build: the import resolver follows workspace packages to their ./dist.
      - name: Lint
        if: steps.pick.outputs.suite == 'true'
        run: pnpm lint

      # --- docs (was the `docs` leaf) -------------------------------------------------------------
      # prettier + roadmap / arch-trees / obs-evals / adr-numbers / guidance / vocab / tokens /
      # migrations / source-nul / build-context / wiki / intents / controls / watch checks.
      - name: Gates (format + docs)
        if: steps.pick.outputs.docs == 'true'
        run: pnpm format:check
      # A protocol schema change or a new runtime dep must carry an ADR; an accepted ADR's Decision
      # is immutable (ADR 180). Diff-based, so PRs only.
      - name: ADR-gated changes
        if: steps.pick.outputs.docs == 'true' && github.event_name == 'pull_request'
        env:
          CHANGE_ADR_BASE: origin/${{ github.base_ref }}
        run: pnpm change-adr:check

      # --- coverage (was the `coverage` leaves + merge) -------------------------------------------
      # One job, no shards (ADR 515): the floors are enforced here, as on every one-shard run since
      # ADR 498. Two workers on the 2 vCPU runner (lane 01M3ZC1Z6G, #1985).
      - name: Tests + coverage
        if: steps.pick.outputs.coverage == 'true'
        run: pnpm coverage --maxWorkers=2 --reporter=default --reporter=github-actions
        env:
          MUSTERD_TEST_DRIVER: ${{ steps.pick.outputs.kinds }}

      # --- a11y (was the two a11y leaves) ---------------------------------------------------------
      # Contrast cannot be computed from hex (alpha tints, color-mix()), so it sweeps the built client
      # in real Chrome; target size (WCAG 2.2 AA 2.5.8) is measured at phone width. The connected
      # phase stands up a throwaway daemon over a synthetic team so /board and /live are measured
      # past their sign-in screen. CHROME_BIN is named so a runner-image change fails loudly.
      - name: A11y contrast (prerendered routes)
        if: steps.pick.outputs.a11y == 'true'
        run: pnpm a11y:check --static-only
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: A11y tap targets (390x844, prerendered)
        if: steps.pick.outputs.a11y == 'true'
        run: pnpm a11y:targets:check --static-only
        env:
          CHROME_BIN: /usr/bin/google-chrome
      # The gate about the gate: five fixtures with known verdicts, three of which MUST fail.
      - name: A11y tap-target falsifier (controls)
        if: steps.pick.outputs.a11y == 'true'
        run: node scripts/a11y/target-size-falsifier.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: A11y contrast (connected board + live)
        if: steps.pick.outputs.a11y == 'true'
        run: pnpm a11y:check --connected-only
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: A11y tap targets (390x844, connected board + live)
        if: steps.pick.outputs.a11y == 'true'
        run: pnpm a11y:targets:check --connected-only
        env:
          CHROME_BIN: /usr/bin/google-chrome

      # ADR 512/515: the marker the next push to main reads to decide whether it must run the full
      # check. Written only when the full check passed — a red one is retried by the next push.
      - name: Mark the full main check
        if: success() && steps.pick.outputs.fullcheck == 'true'
        run: |
          mkdir -p full-main-check
          echo "${GITHUB_SHA} $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${GITHUB_RUN_ID}" > full-main-check/marker.txt
      - name: Upload the full-main-check marker
        if: success() && steps.pick.outputs.fullcheck == 'true'
        # Pinned by commit (not by tag). v7.0.1.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-main-check
          path: full-main-check/
          retention-days: 2

  # ADR 508: a scheduled run is main's only full check that no PR waits on, so a red one would go
  # unseen. Open one `ci: main is red` issue, or comment on the open one, naming the run.
  main-red:
    name: main-red
    runs-on: ubuntu-latest
    needs: [gates]
    if: always() && needs.gates.result == 'failure' && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open or update the main-is-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Scheduled CI on main failed at ${GITHUB_SHA} — ${RUN_URL}. The 4-hourly run is main's only full coverage + a11y check (ADR 508); fix forward, then close this issue."
          n=$(gh issue list --state open --search 'in:title "ci: main is red"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title 'ci: main is red' --body "$body"; fi
