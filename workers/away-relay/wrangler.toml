# The away-channels relay (ADR 659, lane 01M50XPXWE). One Durable Object per team holds that
# team's pending-delivery metadata (never ask content); the daemon dials out to it over one
# hibernating WebSocket. Ships UNDEPLOYED: an operator deploys it in the dedicated musterd
# Cloudflare account and sets the secret below directly (never through an agent, ADR 659 §4).
#
#   cd workers/away-relay && wrangler deploy
#   wrangler secret put TEAM_CREDENTIALS_JSON   # {"<team-slug>": "<sha256 hex of the credential>"}
#   wrangler secret put SLACK_SIGNING_SECRET    # Slack app signing secret (ADR 668 — lives only here)
#   wrangler secret put SLACK_TEAM_MAP_JSON     # {"<slack-team-id>": "<team-slug>"}
#   wrangler secret put APNS_KEY_P8             # the APNs token key (.p8, PEM) — ADR 676 §9
#   wrangler secret put TEAM_QUOTAS_JSON        # optional: {"<team-slug>": {"per_minute": 60, "per_day": 10000}}
#   wrangler secret put SLACK_CLIENT_SECRET     # the distributed Slack app's client secret (increment 9)
# SLACK_CLIENT_ID is a plain [vars] entry below, set by the operator with the app's client id.
name = "musterd-away-relay"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# The musterd app's push (ADR 676 §9): not secrets — the key id, Apple Developer team id and
# bundle id. No push is sent until all four (with APNS_KEY_P8) are present. The key is
# production-only and topic-scoped to io.musterd.app (2026-10-20): TestFlight pushes work, a dev
# build's sandbox token is refused by Apple and the reason comes back on `delivered`.
[vars]
APNS_KEY_ID = "2C5VN5ZZ3J"
APNS_TEAM_ID = "D27MJGWNY3"
APNS_TOPIC = "io.musterd.app"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "AWAY_RELAY"
class_name = "TeamRelay"

[[durable_objects.bindings]]
name = "SLACK_INSTALLS"
class_name = "SlackInstalls"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamRelay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SlackInstalls"]
